name: Build Crazy Bike (Fabric 1.21.1)

on:
  push:
    branches: [crazy-bike-1.21.1]
    paths:
      - "crazy-bike/**"
      - ".github/workflows/crazy-bike-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build mod
        working-directory: crazy-bike
        run: gradle build --no-daemon
      - name: Upload only the installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CrazyBike-Fabric-1.21.1
          path: crazy-bike/build/libs/crazy-bike-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
